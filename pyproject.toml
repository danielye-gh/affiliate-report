[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "affiliate-report"
version = "0.1.0"
description = "Fetch and preprocess monthly affiliate actions reports from CJ, Impact, Awin, and Shopify"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "python-dotenv>=1.0",
]

[project.scripts]
affiliate-report = "affiliate_report.cli:main"
affiliate-report-gui = "affiliate_report.gui.report_app:main"

[tool.setuptools.packages.find]
where = ["src"]
